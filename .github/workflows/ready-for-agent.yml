name: Ready for Agent Trigger

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  agent_dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run baseline verification with retry limit (max 2 attempts)
        id: verify
        run: |
          set +e
          ATTEMPT=1
          MAX_ATTEMPTS=2
          PASSED=false
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Verification attempt $ATTEMPT/$MAX_ATTEMPTS"
            npm test && npm run build
            if [ $? -eq 0 ]; then
              PASSED=true
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "attempts=$ATTEMPT" >> $GITHUB_OUTPUT
          if [ "$PASSED" != "true" ]; then
            exit 1
          fi

      - name: Prepare agent branch & post work order
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        run: |
          BRANCH="agent/issue-${ISSUE_NUMBER}"
          git config user.name "hearth-factory-bot"
          git config user.email "hearth-factory-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH" || true

          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title -q .title)
          gh issue comment "$ISSUE_NUMBER" --body "### 🤖 Hearth Factory Triggered (\`ready-for-agent\`)
          - **Ticket:** #${ISSUE_NUMBER} — ${ISSUE_TITLE}
          - **Prepared branch:** \`${BRANCH}\`
          - **Baseline checks (\`npm test\` + \`npm run build\`):** Passed (attempt ${{ steps.verify.outputs.attempts }}/2)
          - **Rules loaded:** \`AGENTS.md\` (5 review standards)
          - **Next step:** Agent implements acceptance criteria on \`${BRANCH}\` and opens a PR for Qodo review."
