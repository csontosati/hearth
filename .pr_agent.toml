# Qodo (PR-Agent) Configuration for Hearth
# Configures automated code review, PR descriptions, and quality gate inspection.

[pr_reviewer]
# Require score and focus on architectural and canvas integrity
require_score_review = true
require_tests_review = true
enable_help_text = false
extra_instructions = """
In Hearth, enforce the review standards defined in AGENTS.md:
1. Rule 1 (The No Invisible Feathers Rule): In ASCII sprite definitions (src/render/pixel/**), ensure every row is exactly 16 characters wide and all glyphs exist in the character's palette dictionary.
2. Rule 2 (The Clean Sanctuary Loop Rule): Ensure WorldState and renderers never perform direct network fetch/async calls; all I/O belongs in decoupled providers.
3. Rule 3 (The No Ghost Callbacks Rule): Verify that timers, event listeners, and particle arrays have explicit lifecycle teardown (disconnect/destroy).
4. Rule 4 (The 16-Bit Atmosphere Rule): Reject modern smooth web styles; enforce CSS theme tokens, pixelated fonts, and pixel-rendering.
5. Rule 5 (The Forge Verification Gate): Require zero TypeScript 'any' escapes and verify all state transitions have matching Vitest unit tests.
"""

[pr_description]
publish_labels = true
final_update_message = true

[pr_code_suggestions]
num_code_suggestions_per_chunk = 3
rank_suggestions = true

[config]
model = "gpt-4o"
fallback_models = ["claude-3-5-sonnet", "gemini-1.5-pro"]

